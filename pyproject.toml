[project]
name = "harvest-hunt"
version = "0.1.0"
description = "Do people who support women working actually share the housework? ISSP 2022 analysis and a local-first household tool."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
